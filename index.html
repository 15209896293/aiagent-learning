<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeHub · Vibe Coding 术语图鉴</title>
<link rel="stylesheet" href="style.css">
<style>
/* 设计令牌已抽至根级 style.css（共享统一视觉世界，Electric Blue） */
/* 以下为术语图鉴页专属样式 */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}

/* ============ 顶部导航 ============ */
.nav{
  position:sticky;top:0;z-index:50;
  height:var(--nav-h);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;gap:8px;
  padding:0 24px;
}
.nav .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;letter-spacing:-.2px;margin-right:14px}
.nav .logo .mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--brand),#7c93ff);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 40%,transparent);
}
.nav .logo .sub{font-size:11px;font-weight:500;color:var(--text-3);margin-left:1px}
.nav .menu{display:flex;align-items:center;gap:2px}
.nav .menu a{
  padding:7px 12px;border-radius:8px;font-size:14px;color:var(--text-2);
  transition:background .15s,color .15s;
}
.nav .menu a:hover{background:var(--brand-light);color:var(--brand)}
.nav .menu a.active{color:var(--brand);font-weight:600}
.nav .spacer{flex:1}
.nav .search{
  display:flex;align-items:center;gap:6px;
  background:var(--bg-soft);border:1px solid var(--border);
  border-radius:9px;padding:6px 11px;width:200px;transition:.15s;
}
.nav .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.nav .search input{border:none;background:none;outline:none;font-size:13px;flex:1;color:var(--text);min-width:0}
.nav .search input::placeholder{color:var(--text-3)}
.nav .icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-2);transition:.15s;font-size:15px;
}
.nav .icon-btn .ic{width:16px;height:16px;grid-area:1/1}
.nav .menu a .ic{width:15px;height:15px;vertical-align:-2px;margin-right:3px}
.nav .search .ic{width:14px;height:14px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex-shrink:0}
.nav .icon-btn:hover{background:var(--brand-light);color:var(--brand)}
.nav .key-chip{
  font-size:11px;font-weight:600;color:var(--brand);
  background:var(--brand-light);border-radius:7px;padding:4px 8px;cursor:pointer;transition:.15s;
}
.nav .key-chip:hover{background:var(--brand-light-2)}
@media(max-width:760px){
  .nav{padding:0 14px;gap:4px}
  .nav .menu{display:none}
  .nav .search{width:130px}
  .nav .logo .sub{display:none}
}

/* ============ 主体容器 ============ */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
@media(max-width:760px){.wrap{padding:0 16px}}

/* ============ Hero / 生成器 ============ */
.hero{padding:46px 0 26px;text-align:center}
.hero h1{font-size:34px;font-weight:780;letter-spacing:-.6px;line-height:1.15;margin-bottom:10px}
.hero h1 .grad{background:linear-gradient(120deg,var(--brand),#7c93ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.sub{color:var(--text-2);font-size:15.5px;margin-bottom:22px}
.gen-box{max-width:560px;margin:0 auto;text-align:left}
.gen-input{
  display:flex;gap:8px;background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:8px 8px 8px 14px;box-shadow:var(--shadow-card);transition:.15s;
}
.gen-input:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-light)}
.gen-input input{flex:1;border:none;outline:none;font-size:14.5px;background:none;color:var(--text)}
.gen-input input::placeholder{color:var(--text-3)}
.gen-btn{
  background:var(--brand);color:#fff;font-weight:650;font-size:14px;
  padding:9px 18px;border-radius:9px;transition:.15s;white-space:nowrap;
}
.gen-btn:hover{background:var(--brand-2);transform:translateY(-1px)}
.gen-btn:disabled{opacity:.6;cursor:wait;transform:none}
.gen-suggest{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.gen-suggest button{
  font-size:12.5px;color:var(--text-2);background:var(--bg-soft);border:1px solid var(--border);
  padding:5px 11px;border-radius:99px;transition:.15s;
}
.gen-suggest button:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}

/* 生成结果预览 */
.gen-result{margin-top:22px;display:none}
.gen-result.show{display:block}
.gen-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gen-bar .tag{font-size:12px;color:var(--text-3)}
.gen-bar .acts{margin-left:auto;display:flex;gap:6px}
.gen-bar .acts button{font-size:12px;color:var(--text-2);background:var(--bg-soft);border:1px solid var(--border);padding:5px 10px;border-radius:7px;transition:.15s}
.gen-bar .acts button:hover{border-color:var(--brand);color:var(--brand)}
.preview-frame{
  width:100%;height:420px;border:1px solid var(--border);border-radius:12px;
  background:#fff;box-shadow:var(--shadow-card);overflow:hidden;
}
.preview-empty{height:100%;display:grid;place-items:center;color:var(--text-3);font-size:13.5px;text-align:center;padding:20px}
.gen-loading{display:flex;align-items:center;gap:10px;justify-content:center;padding:30px;color:var(--text-2);font-size:14px}
.spinner{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-err{color:#e5484d;font-size:13.5px;background:color-mix(in srgb,#e5484d 8%,var(--bg));border:1px solid color-mix(in srgb,#e5484d 30%,var(--bg));padding:12px 14px;border-radius:10px;margin-top:12px}

/* ============ 筛选区 ============ */
.atlas-head{padding:18px 0 6px;position:sticky;top:var(--nav-h);background:var(--bg);z-index:20}
.domains{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.domain-pill{
  font-size:12.5px;font-weight:600;color:var(--text-2);
  background:var(--bg-soft);border:1px solid var(--border);
  padding:5px 11px;border-radius:8px;transition:.15s;display:flex;align-items:center;gap:6px;
}
.domain-pill .cnt{font-size:11px;color:var(--text-3);font-weight:500}
.domain-pill:hover{border-color:var(--brand);color:var(--brand)}
.domain-pill.active{background:var(--brand-light);color:var(--brand);border-color:transparent;font-weight:650}
.domain-pill.active .cnt{color:var(--brand)}
.sections{display:flex;gap:14px;flex-wrap:wrap;padding:4px 0 10px;border-bottom:1px solid var(--border-light)}
.sec-tab{font-size:13.5px;color:var(--text-3);padding:4px 0;position:relative;transition:.15s;cursor:pointer}
.sec-tab:hover{color:var(--text)}
.sec-tab.active{color:var(--text);font-weight:600}
.sec-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:2px;background:var(--brand);border-radius:2px}

/* ============ 术语卡片 ============ */
.atlas{padding:22px 0 60px}
.sec-group{margin-bottom:30px}
.sec-title{font-size:13px;font-weight:650;color:var(--text-3);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.sec-title .n{font-size:12px;font-weight:500;color:var(--text-3);background:var(--bg-soft);border:1px solid var(--border-light);padding:2px 8px;border-radius:99px}
.cards{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{
  background:var(--bg);border:0.8px solid var(--border);border-radius:var(--radius);
  padding:18px 16px 16px;transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;gap:10px;cursor:pointer;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);border-color:var(--border-hover)}
.card .c-head{display:flex;align-items:baseline;gap:8px}
.card .cn{font-size:16px;font-weight:620;color:var(--text);letter-spacing:-.1px}
.card .en{font-size:13.5px;font-weight:500;color:var(--brand)}
.card .star{margin-left:auto;color:var(--text-3);font-size:15px;transition:.15s;line-height:1}
.card .star:hover{color:#f5a623}
.card .star.on{color:#f5a623}
.card .desc{font-size:14px;color:var(--text-2);line-height:1.6;padding-left:14px;position:relative}
.card .desc::before{content:"\201C";position:absolute;left:0;top:-3px;color:var(--brand);font-size:18px;font-weight:700;line-height:1;opacity:.7}
.card .demo{background:var(--bg-demo);border-radius:var(--radius-sm);padding:14px;overflow:hidden;position:relative}
.card .demo .lbl{position:absolute;top:6px;right:8px;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px}
.demo-empty{font-size:12px;color:var(--text-3);text-align:center;padding:8px}
.card .c-link{font-size:12px;color:var(--brand);opacity:0;transition:.15s}
.card:hover .c-link{opacity:1}

/* ============ 空状态 ============ */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state .big{font-size:42px;margin-bottom:10px}
.empty-state p{font-size:14px}

/* ============ 次级页面面板 ============ */
.panel{padding:30px 0 80px}
.panel h2{font-size:24px;font-weight:720;margin-bottom:6px;letter-spacing:-.3px}
.panel .lead{color:var(--text-2);margin-bottom:24px;font-size:14.5px}
.panel .block{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.panel .block h3{font-size:15px;font-weight:650;margin-bottom:8px}
.panel .block p{font-size:14px;color:var(--text-2)}
.panel .block code{font-family:var(--mono);font-size:13px;background:var(--bg-demo);padding:2px 6px;border-radius:5px}
.quiz-q{font-size:14.5px;font-weight:600;margin-bottom:10px}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{font-size:13.5px;text-align:left;padding:10px 13px;border:1px solid var(--border);border-radius:9px;transition:.15s;color:var(--text-2)}
.quiz-opt:hover{border-color:var(--brand);color:var(--brand)}
.quiz-opt.correct{background:color-mix(in srgb,#16a34a 10%,var(--bg));border-color:#16a34a;color:#16a34a}
.quiz-opt.wrong{background:color-mix(in srgb,#e5484d 10%,var(--bg));border-color:#e5484d;color:#e5484d}
.install-cmd{font-family:var(--mono);font-size:13px;background:var(--bg-demo);border:1px solid var(--border);border-radius:9px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.install-cmd button{margin-left:auto;color:var(--brand);font-size:12px}

/* ============ 设置弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--bg);border-radius:16px;box-shadow:var(--shadow-float);width:100%;max-width:460px;padding:24px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:6px}
.modal .desc{font-size:13px;color:var(--text-2);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13.5px;outline:none;color:var(--text);background:var(--bg)}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:5px;line-height:1.5}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn-pri{background:var(--brand);color:#fff;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:9px;transition:.15s}
.btn-pri:hover{background:var(--brand-2)}
.btn-ghost{font-size:13.5px;color:var(--text-2);padding:9px 14px;border-radius:9px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-hover)}

/* ============ 页脚 ============ */
footer{border-top:1px solid var(--border-light);padding:26px 0 40px;color:var(--text-3);font-size:12.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
footer a:hover{color:var(--brand)}
footer .right{margin-left:auto;display:flex;gap:14px}

/* ============ 术语详情页 ============ */
.detail{padding:20px 0 80px;max-width:var(--maxw);margin:0 auto}
.detail-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.detail-bar .back{display:flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border);border-radius:9px;font-size:13px;color:var(--text-2);transition:.15s}
.detail-bar .back:hover{border-color:var(--brand);color:var(--brand)}
.detail-bar .crumb{font-size:13px;color:var(--text-3)}
.detail-bar .crumb b{color:var(--text-2)}
.detail-bar .spacer{flex:1}
.detail-bar .bar-btn{padding:6px 11px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--text-2);transition:.15s}
.detail-bar .bar-btn:hover{border-color:var(--brand);color:var(--brand)}
.detail-bar .nav-btn{padding:6px 12px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--text-3);transition:.15s}
.detail-bar .nav-btn:hover{border-color:var(--brand);color:var(--brand)}

.detail h1{font-size:30px;font-weight:750;letter-spacing:-.5px;margin-bottom:2px}
.detail h1 .en{font-size:18px;color:var(--text-3);font-weight:500;margin-left:8px}
.detail .aka{font-size:12.5px;color:var(--text-3);margin-bottom:16px}
.detail .aka b{font-weight:600;color:var(--text-2)}

.detail .quote{background:var(--bg-soft);border:1px solid var(--border-light);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;position:relative}
.detail .quote .lbl{font-size:11.5px;font-weight:600;color:var(--brand);margin-bottom:5px}
.detail .quote p{font-size:14.5px;color:var(--text-2);line-height:1.7}

.detail .explain{font-size:15px;line-height:1.85;color:var(--text);margin-bottom:24px}
.detail .explain b{font-weight:700}
.detail .explain .note{font-size:13.5px;color:var(--text-3);margin-top:10px;padding:10px 14px;background:var(--bg-soft);border-radius:var(--radius-sm);border:1px solid var(--border-light)}

.detail .prereq{font-size:13px;color:var(--text-3);margin-bottom:20px}
.detail .prereq a{color:var(--brand);border-bottom:1px dashed var(--brand)}

.detail .diagram{background:var(--bg-demo);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;margin-bottom:24px}
.detail .diagram .d-title{font-size:15px;font-weight:650;margin-bottom:14px;text-align:center}
.detail .diagram .d-stage{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-height:140px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.detail .diagram .d-nav{display:flex;align-items:center;justify-content:space-between}
.detail .diagram .d-nav button{padding:6px 16px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-2);transition:.15s}
.detail .diagram .d-nav button:hover{border-color:var(--brand);color:var(--brand)}
.detail .diagram .d-nav button:disabled{opacity:.35;cursor:default}
.detail .diagram .d-nav .d-count{font-size:12.5px;color:var(--text-3)}

.detail .quiz{margin-bottom:24px}
.detail .quiz .q-lbl{font-size:12px;color:var(--text-3);margin-bottom:8px}
.detail .quiz .q-title{font-size:15.5px;font-weight:600;margin-bottom:14px;line-height:1.6}
.detail .quiz .q-opts{display:flex;flex-direction:column;gap:8px}
.detail .quiz .q-opt{text-align:left;padding:12px 15px;border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--text-2);transition:.15s;line-height:1.5}
.detail .quiz .q-opt:hover{border-color:var(--brand);color:var(--brand)}
.detail .quiz .q-opt.correct{background:color-mix(in srgb,#16a34a 8%,var(--bg));border-color:#16a34a;color:#16a34a}
.detail .quiz .q-opt.wrong{background:color-mix(in srgb,#e5484d 8%,var(--bg));border-color:#e5484d;color:#e5484d}
.detail .quiz .q-explain{display:none;margin-top:12px;padding:13px 16px;background:var(--bg-soft);border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:13.5px;color:var(--text-2);line-height:1.7}
.detail .quiz .q-explain.show{display:block}
.detail .quiz .q-explain b{color:var(--text)}

.detail .agent-prompt{background:color-mix(in srgb,var(--brand) 6%,var(--bg));border:1px solid color-mix(in srgb,var(--brand) 25%,var(--border));border-radius:var(--radius);padding:16px 18px;margin-bottom:24px}
.detail .agent-prompt .ap-lbl{font-size:12.5px;font-weight:600;color:var(--brand);margin-bottom:8px}
.detail .agent-prompt p{font-size:14px;color:var(--text);line-height:1.75}

.detail .next-terms{margin-bottom:24px}
.detail .next-terms .nt-lbl{font-size:13px;color:var(--text-3);margin-bottom:10px}
.detail .next-terms .nt-list{display:flex;gap:10px;flex-wrap:wrap}
.detail .next-terms .nt-item{display:flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;cursor:pointer;transition:.15s}
.detail .next-terms .nt-item:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.detail .next-terms .nt-item .num{font-size:11px;color:var(--text-3);font-weight:700}

.detail .ext-links{border-top:1px solid var(--border-light);padding-top:18px}
.detail .ext-links .el-lbl{font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.detail .ext-links a{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--brand);margin-right:16px;line-height:2}
.detail .ext-links a:hover{text-decoration:underline}

/* 容易混淆 */
.detail .confused{margin-bottom:24px}
.detail .confused .c-lbl{font-size:14px;font-weight:650;margin-bottom:12px}
.detail .confused .c-card{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-soft)}
.detail .confused .c-card+.c-card{margin-top:10px}
.detail .confused .c-vs{font-size:13px;color:var(--text-3);font-weight:700;flex-shrink:0;padding:2px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border)}
.detail .confused .c-text{font-size:13.5px;color:var(--text-2);line-height:1.7}
.detail .confused .c-text a{color:var(--brand);border-bottom:1px dashed var(--brand)}

/* 组成结构 Anatomy */
.detail .anatomy{margin-bottom:24px}
.detail .anatomy .a-lbl{font-size:14px;font-weight:650;margin-bottom:14px}
.detail .anatomy .a-stage{background:var(--bg-demo);border:1px solid var(--border-light);border-radius:var(--radius);padding:20px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;min-height:80px}
.detail .anatomy .a-list{display:flex;flex-direction:column;gap:10px}
.detail .anatomy .a-item{display:flex;gap:10px;align-items:flex-start}
.detail .anatomy .a-num{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.detail .anatomy .a-content{flex:1}
.detail .anatomy .a-name{font-weight:600;font-size:13.5px;color:var(--text)}
.detail .anatomy .a-desc{font-size:13px;color:var(--text-3);line-height:1.6;margin-top:2px}

/* 常见变体 Variants */
.detail .variants{margin-bottom:24px}
.detail .variants .v-lbl{font-size:14px;font-weight:650;margin-bottom:14px}
.detail .variants .v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.detail .variants .v-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.detail .variants .v-demo{background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:14px;margin-bottom:8px;min-height:50px;display:flex;align-items:center;justify-content:center}
.detail .variants .v-name{font-weight:600;font-size:12.5px;color:var(--text);margin-bottom:2px}
.detail .variants .v-desc{font-size:11.5px;color:var(--text-3);line-height:1.5}

/* 典型使用场景 */
.detail .scenes{margin-bottom:24px}
.detail .scenes .s-lbl{font-size:14px;font-weight:650;margin-bottom:14px}
.detail .scenes .s-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.detail .scenes .s-name{font-size:12.5px;font-weight:600;color:var(--text-3);padding:8px 14px;background:var(--bg-soft);border-bottom:1px solid var(--border-light)}
.detail .scenes .s-demo{padding:16px;background:var(--bg-demo)}

/* ============ 防止AI味儿页 ============ */
.aif-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0}
.aif-tab{padding:9px 16px;font-size:14px;color:var(--text-3);border-bottom:2px solid transparent;transition:.15s;cursor:pointer}
.aif-tab:hover{color:var(--text-2)}
.aif-tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.aif-cat-title{font-size:13px;color:var(--text-3);margin-bottom:16px}
.aif-grid{display:grid;grid-template-columns:1fr;gap:14px}
.aif-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s}
.aif-card:hover{border-color:var(--border-hover)}
.aif-card .aif-head{padding:14px 16px;border-bottom:1px solid var(--border-light)}
.aif-card .aif-head h3{font-size:15px;font-weight:650;margin-bottom:4px}
.aif-card .aif-head p{font-size:13px;color:var(--text-2);line-height:1.6}
.aif-card .aif-body{padding:14px 16px;background:var(--bg-soft)}
.aif-card .aif-body .aif-quote{font-size:17px;font-weight:600;line-height:1.6;color:var(--text);padding:16px 18px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid var(--brand);margin-bottom:8px}
.aif-card .aif-body .aif-fix{font-size:12.5px;color:var(--text-3);line-height:1.6;padding:8px 0 0;border-top:1px solid var(--border-light);margin-top:4px}
.aif-card .aif-body .aif-fix b{color:var(--text-2);font-weight:600}
.aif-card .aif-body .aif-visual{padding:16px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border-light);margin-bottom:8px;min-height:60px;display:flex;align-items:center;justify-content:center;overflow:hidden}
@keyframes aifFadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ============ Skill 页 ============ */
.skill-hero{text-align:center;padding:30px 0 24px}
.skill-hero h2{font-size:28px;font-weight:750;letter-spacing:-.4px;margin-bottom:8px}
.skill-hero p{font-size:15px;color:var(--text-2);max-width:560px;margin:0 auto;line-height:1.7}
.skill-stats{display:flex;gap:30px;justify-content:center;margin:20px 0}
.skill-stats .st{text-align:center}
.skill-stats .st .n{font-size:28px;font-weight:750;color:var(--brand)}
.skill-stats .st .l{font-size:12px;color:var(--text-3)}
.skill-demo{background:var(--bg-demo);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
.skill-demo .demo-chat{display:flex;flex-direction:column;gap:12px}
.skill-demo .demo-msg{max-width:80%;padding:11px 15px;border-radius:12px;font-size:14px;line-height:1.6}
.skill-demo .demo-user{align-self:flex-end;background:var(--brand);color:#fff}
.skill-demo .demo-ai{align-self:flex-start;background:var(--bg);border:1px solid var(--border)}
.skill-demo .demo-ai b{color:var(--brand)}
.skill-install{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:24px}
.skill-install h3{font-size:15px;font-weight:650;margin-bottom:10px}
.skill-install .cmd{font-family:var(--mono);font-size:13px;background:var(--bg-demo);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;line-height:1.6}
.skill-feature{margin-bottom:20px}
.skill-feature h3{font-size:16px;font-weight:650;margin-bottom:10px}
.skill-feature .sf-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.skill-feature .sf-box{padding:14px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.6}
.skill-feature .sf-orig{background:var(--bg-soft);border:1px solid var(--border)}
.skill-feature .sf-orig .lbl{font-size:11.5px;color:var(--text-3);margin-bottom:5px}
.skill-feature .sf-new{background:var(--brand-light);border:1px solid color-mix(in srgb,var(--brand) 25%,var(--border))}
.skill-feature .sf-new .lbl{font-size:11.5px;color:var(--brand);margin-bottom:5px;font-weight:600}
.skill-feature .sf-new a{color:var(--brand);border-bottom:1px dashed var(--brand)}
.skill-principles{border-top:1px solid var(--border-light);padding-top:18px}
.skill-principles h3{font-size:15px;font-weight:650;margin-bottom:10px}
.skill-principles li{font-size:13.5px;color:var(--text-2);line-height:1.7;list-style:none;padding:6px 0 6px 20px;position:relative}
.skill-principles li::before{content:"✓";position:absolute;left:0;color:#16a34a;font-weight:700}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}

  view:"atlas", domain:"frontend", section:"all", query:"",

   领域元信息
   =========================================================== */
const DOMAIN_META = [
  {key:"frontend", cn:"前端", en:"Frontend"},
  {key:"backend",  cn:"后端", en:"Backend"},
  {key:"product",  cn:"产品", en:"Product"},
  {key:"tech",     cn:"技术栈", en:"Tech Stack"},

  {key:"fav",      cn:"收藏", en:"Favorites"}
];

/* ===========================================================
   渲染：领域标签
   =========================================================== */
function renderDomains(){
  const box = document.getElementById("domains");
  box.innerHTML = "";
  DOMAIN_META.forEach(d=>{
    const cnt = d.key==="fav" ? STATE.favorites.length : TERMS.filter(t=>t.domain===d.key).length;
    const el = document.createElement("button");
    el.className = "domain-pill"+(STATE.domain===d.key?" active":"");
    el.innerHTML = `${d.cn} <span class="cnt">${cnt}</span>`;
    el.onclick = ()=>{ STATE.domain=d.key; STATE.section="all"; STATE.query=""; document.getElementById("searchInput").value=""; renderAll(); };
    box.appendChild(el);
  });
}

/* 渲染子分类标签 */
function renderSections(){
  const box = document.getElementById("sections");
  let secs;
  if(STATE.domain==="fav"){
    secs = [{key:"all",cn:"全部收藏"}];
  } else {
    const set = [];
    TERMS.forEach(t=>{ if(t.domain===STATE.domain && !set.includes(t.section)) set.push(t.section); });
    secs = [{key:"all",cn:"全部"}, ...set.map(s=>({key:s,cn:s}))];
  }
  box.innerHTML = "";
  secs.forEach(s=>{
    const el = document.createElement("span");
    el.className = "sec-tab"+(STATE.section===s.key?" active":"");
    el.textContent = s.cn;
    el.onclick = ()=>{ STATE.section=s.key; renderAtlas(); };
    box.appendChild(el);
  });
}

/* ===========================================================
   渲染：术语图鉴
   =========================================================== */
function visibleTerms(){
  let list = TERMS;
  if(STATE.query){
    // 有搜索词时跨所有领域搜索
    const q = STATE.query.toLowerCase();
    list = list.filter(t=> t.cn.toLowerCase().includes(q)||t.en.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q));
  } else if(STATE.domain==="fav"){
    list = list.filter(t=>STATE.favorites.includes(t.id));
  } else {
    list = list.filter(t=>t.domain===STATE.domain);
  }
  if(STATE.section!=="all") list = list.filter(t=>t.section===STATE.section);
  return list;
}
function renderAtlas(){
  const box = document.getElementById("atlas");
  const list = visibleTerms();
  if(!list.length){
    box.innerHTML = `<div class="empty-state"><div class="big" style="font-size:32px;color:var(--border)">—</div><p>这里还没有术语。换个领域或清空搜索试试。</p></div>`;
    return;
  }
  // 按分区分组
  const groups = {};
  list.forEach(t=>{ (groups[t.section]=groups[t.section]||[]).push(t); });
  let html = "";
  Object.keys(groups).forEach(sec=>{
    html += `<div class="sec-group"><div class="sec-title">${sec} <span class="n">${groups[sec].length} 个条目</span></div><div class="cards">`;
    groups[sec].forEach(t=>{
      const on = STATE.favorites.includes(t.id)?" on":"";
      const lk = t.link?`<span class="c-link">打开 →</span>`:"";
      html += `<div class="card" data-id="${t.id}" data-link="${t.link||""}">
        <div class="c-head">
          <span class="cn">${t.cn}</span>
          <span class="en">${t.en}</span>
          <span class="star${on}" data-fav="${t.id}">☆</span>
        </div>
        <div class="desc">${t.desc}</div>
        <div class="demo">${renderDemo(t)}</div>
        ${lk}
      </div>`;
    });
    html += `</div></div>`;
  });
  box.innerHTML = html;
  // 绑定收藏
  box.querySelectorAll("[data-fav]").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggleFav(el.getAttribute("data-fav")); };
  });
  // 绑定卡片点击 → 打开详情页
  box.querySelectorAll(".card").forEach(c=>{
    c.onclick = (e)=>{ if(e.target.classList.contains("star")) return; openDetail(c.getAttribute("data-id")); };
  });
}

function renderDemo(t){
  const key = t.en.replace(/[^a-zA-Z]/g,"").toLowerCase();
  const D = DEMOS[key];
  if(D) return `<div class="lbl">demo</div>` + D;
  const lbl = DOMAIN_META.find(m=>m.key===t.domain)?.cn || t.domain;
  return `<div class="lbl">${lbl}</div><div style="display:grid;place-items:center;padding:4px;min-height:36px">${cardVisual(t)}</div>`;
}

/* ===========================================================
   收藏
   =========================================================== */
function toggleFav(id){
  const i = STATE.favorites.indexOf(id);
  if(i>=0) STATE.favorites.splice(i,1); else STATE.favorites.push(id);
  localStorage.setItem("vh_favs",JSON.stringify(STATE.favorites));
  renderDomains();
  if(STATE.domain==="fav") renderSections();
  renderAtlas();
}

/* ===========================================================
   渲染入口
   =========================================================== */
function renderAll(){ renderDomains(); renderSections(); renderAtlas(); }

/* ===========================================================
   搜索
   =========================================================== */
document.getElementById("searchInput").addEventListener("input",e=>{
  STATE.query = e.target.value.trim();
  STATE.section = "all";
  renderSections();
  renderAtlas();
});

/* ===========================================================
   主题
   =========================================================== */
function applyTheme(){
  document.documentElement.setAttribute("data-theme",STATE.theme);
  const btn=document.getElementById("themeBtn");
  const dark=STATE.theme==="dark";
  const moon=btn.querySelector(".i-moon");
  const sun=btn.querySelector(".i-sun");
  if(moon)moon.hidden=dark;
  if(sun)sun.hidden=!dark;
}
document.getElementById("themeBtn").onclick=()=>{
  STATE.theme = STATE.theme==="dark"?"light":"dark";
  localStorage.setItem("vh_theme",STATE.theme);
  applyTheme();
};

/* ===========================================================
   视图切换（术语 / 练习 / 防止AI味儿 / Skill / 交流群）
   =========================================================== */
function switchView(v){
  STATE.view=v;
  ["atlas","practice","anti","skill","group","detail"].forEach(x=>{
    document.getElementById("view-"+x).style.display = x===v?"block":"none";
  });
  document.querySelectorAll(".nav .menu a").forEach(a=>{
    a.classList.toggle("active",a.getAttribute("data-view")===v);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("[data-view]").forEach(a=>{
  a.addEventListener("click",e=>{ e.preventDefault(); switchView(a.getAttribute("data-view")); });
});

/* ===========================================================
   术语详情页 —— 打开 / 渲染
   =========================================================== */
function openDetail(id){
  const term = TERMS.find(t=>t.id===id);
  if(!term) return;
  STATE.detailId = id;
  renderDetail(term);
  switchView("detail");
}

function getDetailData(term){
  // 先生成模板数据（保证 8 板块完整）
  const generated = generateDetailData(term);
  // 如果有手写数据，合并覆盖（手写优先，模板补齐缺失字段）
  const custom = TERM_DETAILS[term.id];
  if(!custom) return generated;
  return Object.assign({}, generated, custom);
}

function findConfusedTerms(term){
  const mapped = CONFUSED_MAP[term.section];
  if(mapped && mapped.length) return mapped;
  const siblings = TERMS.filter(t=>t.domain===term.domain && t.section===term.section && t.id!==term.id);
  if(siblings.length>0){
    return [{id:siblings[0].id, thisSide:`属于「${term.section}」分类`, thatSide:`也属于「${term.section}」，但侧重不同`}];
  }
  const domainOthers = TERMS.filter(t=>t.domain===term.domain && t.section!==term.section);
  if(domainOthers.length>0){
    return [{id:domainOthers[0].id, thisSide:`属于「${term.section}」`, thatSide:`属于「${domainOthers[0].section}」，层面不同`}];
  }
  return [];
}

function generateQuiz(term){
  const section = term.section;
  const domainName = DOMAIN_META.find(m=>m.key===term.domain);
  const dn = domainName ? domainName.cn : term.domain;
  return {
    q: `关于「${term.cn}（${term.en}）」，以下哪个说法最准确？`,
    opts: [
      `${term.desc}`,
      `${term.cn}和「${section}」里的其他概念完全是一回事，没有区别`,
      `${term.cn}只在一个极其特殊的场景下才有用，日常开发完全不需要了解`,
      `${term.cn}是一个已经过时被淘汰的概念，现在没人用了`
    ],
    ans: 0,
    explain: `<b>答案 A。</b>${term.desc}。「${term.cn}」是「${dn}」领域下「${section}」分类的核心概念，和同分类的其他术语有联系但各有侧重。选项 B 混淆了同分类的概念，C 和 D 的说法都不符合实际。`
  };
}

  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在 CSS 布局中，{{cn}}是控制元素位置和对齐的工具。选对布局方式能省掉大量 margin 调试。常见坑：设了宽度加 padding 撑破容器、flex 不换行挤变形、z-index 被覆盖。",
  quiz:{q:"设了 width:300px 加了 padding 后元素变宽了，为什么？",opts:["默认 box-sizing 是 content-box，padding 额外加在宽度外","padding 的颜色太深","width 的单位不对"],ans:0,explain:"<b>答案 A。</b>content-box 下 padding 和 border 会额外撑大元素。设 box-sizing:border-box 后 padding 包含在宽度内。"},
  prompt:"帮我用{{cn}}实现布局：元素排列整齐，间距均匀，窄屏自动换行。注意 box-sizing 和溢出处理。"
},
"文字":{
  quote:"页面文字看着不舒服，是{{cn}}的问题吗？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在文字排版中，{{cn}}影响阅读体验。好的排版有清晰的层级：标题大号加粗、正文适中好读、辅助文字小号浅色。行高、字间距、行宽都会影响可读性。",
  quiz:{q:"正文段落读起来很累，最可能的原因？",opts:["行高太挤、字号太小、行宽太长导致难追行","字体颜色不够深","段落间距太大"],ans:0,explain:"<b>答案 A。</b>阅读疲劳最常见的原因是行高不足（建议 1.5-1.7）、字号太小（建议 14-16px）、行宽过长（建议 45-75 字符）。"},
  prompt:"帮我用{{cn}}优化文字排版：标题层级分明，正文行高舒适，辅助文字清晰区分。确保不同屏幕下都可读。"
},
"外观":{
  quote:"页面看着太素了，用{{cn}}提升一下质感？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在视觉设计中，{{cn}}是提升质感的细节。好的外观不靠堆砌效果，而是统一规范：圆角统一大小、阴影分层级、颜色不超三种主色。过度装饰反而降低专业感。",
  quiz:{q:"页面看着花哨但不专业，最可能的原因？",opts:["效果堆砌太多：阴影、渐变、圆角各用各的没有统一规范","颜色不够多","动画不够丰富"],ans:0,explain:"<b>答案 A。</b>不专业感来自视觉不统一。阴影深度、圆角大小、渐变方向应该有规范。堆砌效果会显得廉价。"},
  prompt:"帮我用{{cn}}提升页面质感：效果适度不堆砌，和现有设计规范统一。注意深色模式下的表现。"
},
"动画":{
  quote:"页面切换太生硬了，加{{cn}}会不会好点？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在交互动画中，{{cn}}的作用是让状态变化更自然。好的动画服务于功能：让用户知道发生了什么变化，而不是炫技。时长建议 200-400ms，太快像闪、太慢像卡。",
  quiz:{q:"弹窗出现时一闪就出来了，用户被吓到。怎么改？",opts:["加 200-300ms 的渐入动画，让弹窗平滑出现","把弹窗颜色调淡一点","把弹窗字号调小"],ans:0,explain:"<b>答案 A。</b>突然出现会吓到用户。加短渐入动画让变化更自然。颜色和字号是视觉问题，不是出现方式问题。"},
  prompt:"帮我给{{cn}}加动画：时长 300ms，用 ease 缓动函数，出现和消失都要平滑。注意 prefers-reduced-motion 无障碍。"
},
"鼠标":{
  quote:"鼠标交互不太对劲，{{cn}}的状态没做好？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在鼠标交互中，{{cn}}是用户感知「能不能操作」的视觉信号。好的交互状态让用户知道：这个能点（指针变小手）、现在不能点（变灰）、点下去了（有反馈）。漏掉状态会让用户困惑。",
  quiz:{q:"用户说「不知道这个能不能点」，最可能的问题？",opts:["{{cn}}缺少悬停态变化，鼠标放上去没有任何视觉反馈","{{cn}}的颜色不够好看","{{cn}}的边框太粗"],ans:0,explain:"<b>答案 A。</b>用户不知道能否点击，通常是因为缺少 hover 态变化。悬停时应该有视觉变化（变色、阴影、位移）提示可交互。"},
  prompt:"帮我完善{{cn}}的鼠标交互状态：hover 有视觉变化、active 有按下反馈、disabled 变灰不可点、cursor 指针正确切换。"
},
"网络与地址":{
  quote:"网站打不开，是{{cn}}的问题吗？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在网络基础中，{{cn}}是互联网通信的一环。用户输入域名，DNS 把它翻译成 IP，浏览器通过 HTTP/HTTPS 连到服务器。任何一环出问题都会导致网站打不开。",
  quiz:{q:"用户输入域名后页面打不开，但直接用 IP 能访问。问题在哪？",opts:["DNS 解析出了问题，域名没有正确翻译成 IP","HTTP 协议版本太旧","服务器的端口被占用"],ans:0,explain:"<b>答案 A。</b>IP 能访问说明服务器正常，域名不行说明 DNS 解析有问题。检查 DNS 记录是否配置正确。"},
  prompt:"帮我理解{{cn}}（{{en}}）在网络通信中的作用。{{desc}}给我一个排查网络问题的思路。"
},
"接口与数据":{
  quote:"前后端怎么传数据？{{cn}}是干嘛的？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在前后端通信中，{{cn}}是数据交换的约定。前端发请求，后端返回 JSON 数据。常见坑：跨域被浏览器拦截、字段名前后端不一致、数据格式没校验导致报错。",
  quiz:{q:"前端调接口报 CORS 错误，最可能的原因？",opts:["后端没有设置允许跨域的响应头","前端代码语法错误","网络断了"],ans:0,explain:"<b>答案 A。</b>CORS 是浏览器的安全策略。后端需要设置 Access-Control-Allow-Origin 响应头才能允许跨域请求。"},
  prompt:"帮我理解{{cn}}（{{en}}）在前后端通信中的作用。{{desc}}给我一个完整的请求-响应示例。"
},
"数据库":{
  quote:"用户数据存哪？{{cn}}怎么选？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在数据存储中，{{cn}}解决的是「数据怎么存、怎么查」的问题。关系型用表格存、非关系型用文档存。选型看数据结构是否固定、查询复杂度、并发量。",
  quiz:{q:"用户数据刷新后还在，是因为存在哪？",opts:["存在数据库里，刷新时从数据库重新读取","存在浏览器的内存里","存在 HTML 文件里"],ans:0,explain:"<b>答案 A。</b>数据持久化靠数据库。内存刷新就没了，HTML 是静态的不存动态数据。"},
  prompt:"帮我理解{{cn}}（{{en}}）在数据存储中的作用。{{desc}}给我一个建表和查询的示例。"
},
"后端开发":{
  quote:"前端的数据从哪来？{{cn}}在后端做什么？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在后端开发中，{{cn}}处理的是用户看不见的逻辑：验证权限、存取数据、计算结果。前端发请求，后端处理完返回 JSON。好的后端接口要稳定、安全、文档清晰。",
  quiz:{q:"前端调用后端接口返回 500 错误，最可能的原因？",opts:["后端代码报错了，比如空指针或数据库连接失败","前端的请求格式不对","网络延迟太高"],ans:0,explain:"<b>答案 A。</b>500 是服务器内部错误，说明后端代码执行时出异常了。前端格式不对通常返回 400，网络问题通常超时。"},
  prompt:"帮我理解{{cn}}（{{en}}）在后端开发中的作用。{{desc}}给我一个完整的后端接口实现示例。"
},
"账号与权限":{
  quote:"怎么判断用户是谁？{{cn}}解决什么问题？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在账号系统中，{{cn}}解决的是「你是谁」和「你能做什么」的问题。认证确认身份（登录验证），授权控制权限（管理员 vs 普通用户）。常见做法：登录后发 Token，后续请求带 Token 验证。",
  quiz:{q:"用户登录后刷新页面就不用再登录了，怎么做到的？",opts:["Token 存在 localStorage 或 cookie 里，刷新后自动带上","后端记住了用户的 IP 地址","浏览器自动填密码"],ans:0,explain:"<b>答案 A。</b>登录成功后后端发一个 Token，前端存在 localStorage 或 cookie。刷新时从存储取出 Token 放在请求头里，后端验证有效就不用重新登录。"},
  prompt:"帮我理解{{cn}}（{{en}}）在账号系统中的作用。{{desc}}给我一个完整的认证/授权流程示例。"
},
"上线与排错":{
  quote:"代码写完了怎么上线？{{cn}}是什么环节？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在部署上线中，{{cn}}是从开发到生产的必经环节。常见流程：提交代码 → CI 自动构建测试 → 部署到预发布 → 验收 → 发布生产。出问题要能快速回滚到上一版。",
  quiz:{q:"上线后发现有 Bug，最安全的做法？",opts:["一键回滚到上一版本，修复后再重新发布","在线上直接改代码","把网站关掉等修好"],ans:0,explain:"<b>答案 A。</b>回滚是最安全的应急措施，几秒钟恢复到上一版本。在线上直接改代码风险极高，关站影响用户体验。"},
  prompt:"帮我理解{{cn}}（{{en}}）在部署上线中的作用。{{desc}}给我一个完整的部署流程和回滚方案。"
},
"用户与需求":{
  quote:"用户说要加个{{cn}}，到底要不要做？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在产品设计中，{{cn}}是理解用户的基础。用户说的不一定是他需要的，要通过观察和访谈找到真实痛点。好的需求有明确的用户、场景和目标，不是「加个功能」。",
  quiz:{q:"用户说「我想要一个搜索功能」，你最该先问什么？",opts:["你在什么场景下需要搜索？想搜什么？找不到时怎么办？","搜索框放左边还是右边？","用什么搜索引擎？"],ans:0,explain:"<b>答案 A。</b>先理解用户场景和痛点，再决定做不做、怎么做。直接问实现细节会跳过需求分析。"},
  prompt:"帮我用{{cn}}的思路分析一个用户需求：{{desc}}给我一个需求分析的框架。"
},
"产品规划":{
  quote:"功能太多做不完，{{cn}}怎么排优先级？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在产品规划中，{{cn}}解决的是「先做什么后做什么」的问题。好的规划把有限的资源投到最重要的事情上。MVP 先做核心功能验证假设，再根据数据决定下一步。",
  quiz:{q:"老板要求一个月内上线所有功能，你最该说什么？",opts:["建议先上 MVP：核心功能验证用户是否需要，再迭代","{{cn}}需要更多人力才能按时完成","时间太紧了做不到"],ans:0,explain:"<b>答案 A。</b>用 MVP 思路说服老板：先验证核心假设，再迭代。比直接要人或说做不到更有说服力。"},
  prompt:"帮我用{{cn}}（{{en}}）的思路做产品规划。{{desc}}给我一个优先级排序的方法。"
},
"数据与验证":{
  quote:"做了个新功能，怎么判断有没有效果？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在数据验证中，{{cn}}是用数据说话的工具。不靠直觉判断好坏，而是设计实验、收集数据、分析结果。A/B 测试对比两个版本，漏斗分析找流失环节。",
  quiz:{q:"新版上线后转化率涨了 5%，能说新版更好吗？",opts:["不一定，可能是其他因素影响，需要 A/B 测试控制变量","能，数据涨了就是好","不能，5% 太少了不算"],ans:0,explain:"<b>答案 A。</b>转化率变化可能受季节、活动等外部因素影响。A/B 测试随机分组控制变量，才能确定因果关系。"},
  prompt:"帮我用{{cn}}（{{en}}）的思路设计一个验证方案。{{desc}}给我一个数据收集和分析的流程。"
},
"开发工具":{
  quote:"别人说用{{cn}}更方便，到底怎么用？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在开发工具链中，{{cn}}是提高效率的利器。终端让你用命令操作电脑，包管理器一行命令装依赖，构建工具把源码变成成品。学会这些工具能省大量重复操作。",
  quiz:{q:"同事说「装依赖跑一下 npm install」，他的意思是？",opts:["在终端执行 npm install 命令安装项目需要的代码包","在浏览器里搜索 npm 网站下载","用 npm 软件安装"],ans:0,explain:"<b>答案 A。</b>npm install 是包管理器的命令，在终端里执行，根据 package.json 自动下载所有依赖包。"},
  prompt:"帮我理解{{cn}}（{{en}}）在开发中的作用。{{desc}}给我一个实际使用的示例。"
},
"测试":{
  quote:"代码改了会不会出 Bug？{{cn}}能防住吗？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在测试中，{{cn}}是保证代码质量的手段。单元测试测单个函数、集成测试测模块配合、E2E 测试模拟用户操作。好的测试让你改代码时有底气，不怕改一个地方崩一片。",
  quiz:{q:"改了一个函数后上线崩了，最可能缺什么？",opts:["没有测试覆盖这个函数的调用方，改了没人发现影响","代码注释写得太少","变量名不够规范"],ans:0,explain:"<b>答案 A。</b>没有测试的代码改了不知道影响范围。单元测试能立刻告诉你改了这个函数后哪些地方挂了。"},
  prompt:"帮我理解{{cn}}（{{en}}）在测试中的作用。{{desc}}给我一个测试用例的示例。"
},
"技术栈":{
  quote:"项目该用什么技术？{{cn}}怎么选？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在技术选型中，{{cn}}是项目用到的所有技术的总和。选型要考虑团队能力、社区活跃度、维护成本，不要追新。好的技术栈让团队高效协作，不好的技术栈让每个人都痛苦。",
  quiz:{q:"新项目要用最新框架，但团队没人用过。你的建议？",opts:["先用团队熟悉的框架，新框架做个小项目练手再考虑","直接上新框架边学边做","招一个会用新框架的人"],ans:0,explain:"<b>答案 A。</b>技术选型要考虑团队能力。不熟悉的框架会拖慢进度，先用熟悉的保证交付，新框架可以小范围试。"},
  prompt:"帮我理解{{cn}}（{{en}}）在技术选型中的考量。{{desc}}给我一个选型分析的框架。"
},
"编程语言":{
  quote:"{{cn}}是什么语言？能做什么？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在编程语言中，{{cn}}有自己的语法和适用场景。JavaScript 跑在浏览器里，Python 适合脚本和 AI，TypeScript 是 JS 的严格版。选语言看项目需求和团队能力。",
  quiz:{q:"JS 写的项目老是类型报错，最该怎么做？",opts:["迁移到 TypeScript，让编译器提前发现类型错误","多写注释说明变量类型","用 console.log 检查类型"],ans:0,explain:"<b>答案 A。</b>TypeScript 在编译时就能发现类型错误，比运行时 console.log 调试高效得多。注释和日志不能替代类型检查。"},
  prompt:"帮我理解{{cn}}（{{en}}）的特点和适用场景。{{desc}}给我一个代码示例。"
},
"前端框架":{
  quote:"做前端用{{cn}}好不好？和别的框架比呢？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在前端框架中，{{cn}}提供组件化、状态管理、路由等能力，不用从零搭。React 灵活生态大，Vue 上手快文档好，Next.js 带 SSR 适合做官网。选框架看项目类型和团队。",
  quiz:{q:"做 SEO 重要的官网首页，用纯 React 和 Next.js 哪个好？",opts:["Next.js，因为它支持服务端渲染，搜索引擎能抓到完整内容","纯 React，因为更简单","都一样，SEO 和框架无关"],ans:0,explain:"<b>答案 A。</b>纯 React 是客户端渲染，搜索引擎爬虫可能看不到内容。Next.js 支持 SSR，服务端直接出 HTML，对 SEO 友好。"},
  prompt:"帮我理解{{cn}}（{{en}}）在前端开发中的优势。{{desc}}给我一个组件代码示例。"
},
"CSS 与组件":{
  quote:"写 CSS 太繁琐了，{{cn}}能帮上忙吗？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在 CSS 工具中，{{cn}}提供更高效的样式写法。Tailwind 用工具类直接在 HTML 里调样式不用写 CSS 文件，shadcn/ui 复制代码进项目就能改。选工具看团队习惯和项目复杂度。",
  quiz:{q:"团队对 Tailwind 不熟，要不要在新项目里用？",opts:["先在小范围试，让团队体验后再决定是否全面采用","直接全量使用，逼团队学","不用，太冒险了"],ans:0,explain:"<b>答案 A。</b>新工具需要团队适应期。先小范围试用，评估效率提升和学习成本，再决定是否推广。"},
  prompt:"帮我理解{{cn}}（{{en}}）在 CSS 开发中的用法。{{desc}}给我一个实际示例。"
},
"AI 基础":{
  quote:"AI 到底能干什么不能干什么？{{cn}}怎么理解？",
  explain:"<b>{{cn}}（{{en}}）</b>{{desc}}在 AI 应用中，{{cn}}是使用 AI 前必须理解的基础。AI 能生成文本、理解图片、写代码，但会编造事实（幻觉）、有上下文限制、输出不稳定。知道边界才能用好它。",
  quiz:{q:"AI 回答了一个你不确定的事实，最安全的做法？",opts:["查来源验证，AI 可能编造了看起来合理但不存在的信息","AI 说的应该是对的，直接用","再问一次 AI 确认"],ans:0,explain:"<b>答案 A。</b>AI 幻觉会编造事实，看起来很自信但可能是错的。重要信息一定要查来源验证，不能盲信。"},
  prompt:"帮我理解{{cn}}（{{en}}）在 AI 应用中的意义。{{desc}}给我一个实际使用场景。"
},
"上下文":{

function fillTpl(str,term){
  if(!str) return str;
  return str.replace(/\{\{cn\}\}/g,term.cn).replace(/\{\{en\}\}/g,term.en).replace(/\{\{desc\}\}/g,term.desc).replace(/\{\{section\}\}/g,term.section);
}

function generateDetailData(term){
  const D=term.domain, S=term.section;
  const tpl = SECTION_TEMPLATES[S] || SECTION_TEMPLATES[D] || SECTION_TEMPLATES['aiagent'];
  const dn = DOMAIN_META.find(m=>m.key===D)?.cn || D;
  return {
    quote: tpl ? fillTpl(tpl.quote, term) : term.desc,
    explain: tpl ? fillTpl(tpl.explain, term) : `<b>${term.cn}（${term.en}）</b>${term.desc}`,
    aka: null,
    prereq: [],
    quiz: tpl ? {
      q: fillTpl(tpl.quiz.q, term),
      opts: tpl.quiz.opts.map(o=>fillTpl(o, term)),
      ans: tpl.quiz.ans,
      explain: fillTpl(tpl.quiz.explain, term)
    } : generateQuiz(term),
    prompt: tpl ? fillTpl(tpl.prompt, term) : `帮我实现${term.cn}（${term.en}）相关的功能。`,
    extLinks: term.link ? [{t:'查看完整笔记',u:term.link}] : [],
    confusedWith: findConfusedTerms(term),
    anatomy: ANATOMY_MAP[D] || [],
    anatomyDemo: ANATOMY_DEMO[D] || null,
    variants: VARIANTS_MAP[S] || VARIANTS_MAP[D] || [],
    scenes: SCENES_MAP[S] || SCENES_MAP[D] || []
  };
}

function renderDetail(term){
  const data = getDetailData(term);
  const meta = DOMAIN_META.find(m=>m.key===term.domain);
  const allInDomain = TERMS.filter(t=>t.domain===term.domain);
  const idx = allInDomain.findIndex(t=>t.id===term.id);
  const prev = idx>0 ? allInDomain[idx-1] : null;
  const next = idx<allInDomain.length-1 ? allInDomain[idx+1] : null;
  const fav = STATE.favorites.includes(term.id);

  // 同分区相关术语
  const siblings = allInDomain.filter(t=>t.section===term.section && t.id!==term.id).slice(0,4);

  let html = '';

  // 顶部操作栏
  html += `<div class="detail-bar">
    <button class="back" onclick="switchView('atlas')">← 返回图鉴</button>
    <span class="crumb">术语图鉴 › <b>${meta?meta.cn:term.domain}</b> › ${term.cn}</span>
    <div class="spacer"></div>
    <button class="bar-btn" onclick="toggleFav('${term.id}');renderDetail(TERMS.find(t=>t.id==='${term.id}'))">${fav?'★ 已收藏':'☆ 收藏'}</button>
    ${prev?`<button class="nav-btn" onclick="openDetail('${prev.id}')">← ${prev.cn}</button>`:''}
    ${next?`<button class="nav-btn" onclick="openDetail('${next.id}')">${next.cn} →</button>`:''}
  </div>`;

  // 标题
  html += `<h1>${term.cn}<span class="en">${term.en}</span></h1>`;
  if(data.aka) html += `<div class="aka">也常被叫作 <b>${data.aka}</b></div>`;
  else html += `<div style="height:16px"></div>`;

  // 前置知识
  if(data.prereq && data.prereq.length){
    const prereqLinks = data.prereq.map(pid=>{
      const pt = TERMS.find(t=>t.id===pid);
      return pt?`<a href="javascript:openDetail('${pt.id}')">${pt.cn}</a>`:'';
    }).filter(Boolean).join(' · ');
    html += `<div class="prereq">先知道：${prereqLinks}</div>`;
  }

  // 你可能会说
  html += `<div class="quote"><div class="lbl">你可能会说</div><p>${data.quote}</p></div>`;

  // 正文讲解
  html += `<div class="explain">${data.explain}`;
  if(data.note) html += `<div class="note">${data.note}</div>`;
  html += `</div>`;

  // 交互图解（使用已有 DEMOS）
  const demoKey = term.en.replace(/[^a-zA-Z]/g,"").toLowerCase();
  const demoHtml = DEMOS[demoKey];
  if(demoHtml){
    html += `<div class="diagram">
      <div class="d-title">${term.cn} 长什么样</div>
      <div class="d-stage">${demoHtml}</div>
    </div>`;
  }

  // 容易混淆？这样区分
  if(data.confusedWith && data.confusedWith.length){
    html += `<div class="confused"><div class="c-lbl">容易混淆？这样区分</div>`;
    data.confusedWith.forEach(c=>{
      const ot = TERMS.find(t=>t.id===c.id);
      if(ot){
        html += `<div class="c-card"><span class="c-vs">≠</span><div class="c-text"><a href="javascript:openDetail('${term.id}')">${term.cn} ${term.en}</a> ${c.thisSide||'执行动作'}；<a href="javascript:openDetail('${ot.id}')">${ot.cn} ${ot.en}</a> ${c.thatSide||'用途不同'}。</div></div>`;
      }
    });
    html += `</div>`;
  }

  // 组成结构 · Anatomy
  if(data.anatomy && data.anatomy.length){
    html += `<div class="anatomy"><div class="a-lbl">组成结构 · Anatomy</div>`;
    if(data.anatomyDemo) html += `<div class="a-stage">${data.anatomyDemo}</div>`;
    html += `<div class="a-list">`;
    data.anatomy.forEach((a,i)=>{
      html += `<div class="a-item"><span class="a-num">${i+1}</span><div class="a-content"><span class="a-name">${a.n}</span><div class="a-desc">${a.d}</div></div></div>`;
    });
    html += `</div></div>`;
  }

  // 常见变体 · Variants
  if(data.variants && data.variants.length){
    html += `<div class="variants"><div class="v-lbl">常见变体 · Variants</div><div class="v-grid">`;
    data.variants.forEach(v=>{
      html += `<div class="v-card"><div class="v-demo">${v.demo||''}</div><div class="v-name">${v.n}</div><div class="v-desc">${v.d}</div></div>`;
    });
    html += `</div></div>`;
  }

  // 典型使用场景
  if(data.scenes && data.scenes.length){
    html += `<div class="scenes"><div class="s-lbl">典型使用场景</div>`;
    data.scenes.forEach(s=>{
      html += `<div class="s-card"><div class="s-name">${s.n}</div><div class="s-demo">${s.demo||''}</div></div>`;
    });
    html += `</div>`;
  }

  // 选择题
  if(data.quiz){
    html += `<div class="quiz">
      <div class="q-lbl">选择题 · 选一个你认为最合适的答案</div>
      <div class="q-title">${data.quiz.q}</div>
      <div class="q-opts">`;
    data.quiz.opts.forEach((opt,i)=>{
      html += `<button class="q-opt" onclick="answerQuiz(this,${i},${data.quiz.ans})">${String.fromCharCode(65+i)}. ${opt}</button>`;
    });
    html += `</div>
      <div class="q-explain" id="quizExplain">${data.quiz.explain}</div>
    </div>`;
  }

  // Agent 提示词
  html += `<div class="agent-prompt">
    <div class="ap-lbl">你可以这样告诉 AI Agent</div>
    <p>"${data.prompt}"</p>
  </div>`;

  // 接下来学什么
  if(siblings.length){
    html += `<div class="next-terms">
      <div class="nt-lbl">接下来学什么</div>
      <div class="nt-list">`;
    siblings.forEach((s,i)=>{
      html += `<div class="nt-item" onclick="openDetail('${s.id}')"><span class="num">${i+1}</span>${s.cn} ${s.en} →</div>`;
    });
    html += `</div></div>`;
  }

  // 延伸阅读
  if(data.extLinks && data.extLinks.length){
    html += `<div class="ext-links">
      <div class="el-lbl">延伸阅读 · 权威出处</div>`;
    data.extLinks.forEach(l=>{
      html += `<a href="${l.u}" target="_blank">${l.t} ↗</a>`;
    });
    html += `</div>`;
  }

  // AI Agent 条目的原始文件链接
  if(term.link){
    html += `<div class="ext-links">
      <div class="el-lbl">完整笔记</div>
      <a href="${term.link}" target="_blank">查看原始学习笔记 ↗</a>
    </div>`;
  }

  document.getElementById("panel-detail").innerHTML = html;
}

function answerQuiz(btn, chosen, correct){
  const opts = btn.parentElement.querySelectorAll(".q-opt");
  opts.forEach(o=>{ o.style.pointerEvents="none"; });
  if(chosen===correct){
    btn.classList.add("correct");
  }else{
    btn.classList.add("wrong");
    opts[correct].classList.add("correct");
  }
  document.getElementById("quizExplain").classList.add("show");
}

   GLM 生成功能
   =========================================================== */
const genBtn = document.getElementById("genBtn");
const genResult = document.getElementById("genResult");
const previewFrame = document.getElementById("previewFrame");
let lastHtml = "";

genBtn.onclick = ()=>generate(document.getElementById("genInput").value);
document.getElementById("regen").onclick = ()=>generate(document.getElementById("genInput").value);
document.querySelectorAll(".gen-suggest button").forEach(b=>{
  b.onclick = ()=>{ document.getElementById("genInput").value=b.textContent; generate(b.textContent); };
});
document.getElementById("copyCode").onclick = ()=>{
  if(!lastHtml) return;
  navigator.clipboard.writeText(lastHtml);
};
document.getElementById("openNew").onclick = ()=>{
  if(!lastHtml) return;
  const w = window.open();
  w.document.write(lastHtml); w.document.close();
};

async function generate(desc){
  if(!STATE.apiKey){ openKey(); return; }
  desc = (desc||"").trim();
  if(!desc){ document.getElementById("genInput").focus(); return; }
  genBtn.disabled = true;
  genResult.classList.add("show");
  previewFrame.srcdoc = "";
  previewFrame.srcdoc = `<div class="preview-empty"><div class="gen-loading"><span class="spinner"></span>正在用 GLM-4.7-Flash 生成…</div></div>`;
  try{
    const url = STATE.proxyUrl ? STATE.proxyUrl.replace(/\/$/,"")+"/chat/completions" : GLM.endpoint;
    const res = await fetch(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+STATE.apiKey },
      body: JSON.stringify({
        model: GLM.model,
        messages:[
          {role:"system",content:GLM.systemPrompt},
          {role:"user",content:desc}
        ],
        temperature:0.7
      })
    });
    if(!res.ok){
      const txt = await res.text();
      throw new Error("HTTP "+res.status+" "+txt.slice(0,200));
    }
    const data = await res.json();
    let html = data.choices?.[0]?.message?.content || "";
    html = html.replace(/^```html\s*/i,"").replace(/```\s*$/,"").trim();
    if(!html.startsWith("<!DOCTYPE") && !html.startsWith("<html")){
      const m = html.match(/<!DOCTYPE[\s\S]*<\/html>/i);
      if(m) html = m[0];
    }
    lastHtml = html;
    previewFrame.srcdoc = html;
  }catch(err){
    const msg = String(err.message||err);
    let hint = msg;
    if(/Failed to fetch|NetworkError|CORS/i.test(msg)){
      hint = "浏览器直连被拦（可能是 CORS）。请在 Key 设置里启用本地代理：运行附带的 glm-proxy.py，再把地址填进「本地代理地址」。";
    }else if(/401|403|invalid/i.test(msg)){
      hint = "Key 无效或未授权（"+msg+"）。请检查 bigmodel.cn 的 API Key。";
    }
    previewFrame.srcdoc = `<div class="preview-empty"><div class="gen-err">⚠️ ${hint}</div></div>`;
  }finally{
    genBtn.disabled = false;
  }
}

/* ===========================================================
   页脚占位
   =========================================================== */
document.getElementById("footBrand").textContent = SITE.brand;

/* ===========================================================
   初始化
   =========================================================== */
applyTheme();
updateKeyChip();
renderPanels();
renderAll();
</script>

<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件库 · VibeHub</title>
<link rel="stylesheet" href="../style.css">
<style>
/* 设计令牌已抽至根级 ../style.css（共享统一视觉世界，Electric Blue） */
/* 软件站布局覆盖：内容更宽 + 侧边栏 */
:root{
  --maxw:1080px;
}
/* ============ 软件站专属样式 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============ 顶部导航 ============ */
.nav{
  position:sticky;top:0;z-index:50;
  height:var(--nav-h);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;gap:8px;
  padding:0 24px;
}
.nav .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:650;letter-spacing:-.2px;margin-right:14px}
.nav .logo .mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--brand),#7c93ff);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 40%,transparent);
}
.nav .logo .sub{font-size:11px;font-weight:500;color:var(--text-3);margin-left:1px}
.nav .menu{display:flex;align-items:center;gap:2px}
.nav .menu a{
  padding:7px 12px;border-radius:8px;font-size:14px;color:var(--text-2);
  transition:background .15s,color .15s;
}
.nav .menu a:hover{background:var(--brand-light);color:var(--brand)}
.nav .menu a.active{color:var(--brand);font-weight:600}
.nav .spacer{flex:1}
.nav .icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-2);transition:.15s;font-size:15px;
}
.nav .icon-btn .ic{width:16px;height:16px;grid-area:1/1}
.s-btn .ic{width:14px;height:14px}
.empty-state .ic{color:var(--text-3)}
.nav .icon-btn:hover{background:var(--brand-light);color:var(--brand)}
.nav .home-link{
  font-size:13px;color:var(--text-3);padding:6px 10px;border-radius:7px;
  border:1px solid var(--border);transition:.15s;display:flex;align-items:center;gap:5px;
}
.nav .home-link:hover{border-color:var(--brand);color:var(--brand)}
@media(max-width:760px){
  .nav{padding:0 14px;gap:4px}
  .nav .menu{display:none}
  .nav .logo .sub{display:none}
}

/* ============ 主体布局 ============ */
.main-wrap{
  max-width:var(--maxw);margin:0 auto;
  display:flex;gap:0;min-height:calc(100vh - var(--nav-h) - 80px);
}
@media(max-width:760px){.main-wrap{flex-direction:column}}

/* ============ 侧边栏 ============ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  padding:16px 0;
  border-right:1px solid var(--border-light);
  position:sticky;top:var(--nav-h);
  height:calc(100vh - var(--nav-h));
  overflow-y:auto;
  background:var(--bg);
}
.sidebar .cat-title{
  font-size:11px;font-weight:650;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.5px;padding:10px 16px 6px;
}
.sidebar .cat-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;font-size:13.5px;color:var(--text-2);
  border-radius:0;transition:all .15s;cursor:pointer;
  border-left:2px solid transparent;
}
.sidebar .cat-item:hover{background:var(--brand-light);color:var(--brand)}
.sidebar .cat-item.active{
  background:var(--brand-light);color:var(--brand);
  border-left-color:var(--brand);font-weight:600;
}
.sidebar .cat-item .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;display:grid;place-items:center}
.sidebar .cat-item .icon img{width:16px;height:16px;object-fit:contain;display:block}
.sidebar .cat-item .count{
  margin-left:auto;font-size:11px;color:var(--text-3);
  background:var(--bg-soft);padding:1px 7px;border-radius:99px;
}
.sidebar-search{
  margin:8px 12px 4px;
  display:flex;align-items:center;gap:6px;
  background:var(--bg-soft);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;transition:.15s;
}
.sidebar-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.sidebar-search input{
  border:none;background:none;outline:none;font-size:13px;flex:1;color:var(--text);min-width:0;
}
.sidebar-search input::placeholder{color:var(--text-3)}
@media(max-width:760px){
  .sidebar{
    width:100%;height:auto;position:static;
    border-right:none;border-bottom:1px solid var(--border-light);
    display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;overflow-x:auto;
  }
  .sidebar .cat-title{display:none}
  .sidebar .cat-item{
    font-size:12px;padding:5px 10px;border-radius:8px;border-left:none;
    border:1px solid var(--border);white-space:nowrap;
  }
  .sidebar .cat-item.active{border-color:var(--brand)}
  .sidebar .cat-item .count{margin-left:4px}
  .sidebar-search{display:none}
}

/* ============ 内容区 ============ */
.content{flex:1;padding:20px 24px 40px;min-width:0}
.content-header{margin-bottom:16px}
.content-header h2{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.content-header .info{font-size:13px;color:var(--text-3)}
.content-header .info .tag{
  display:inline-block;background:var(--brand-light);color:var(--brand);
  padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600;margin-left:6px;
}

/* ============ 搜索栏（内容区顶部） ============ */
.search-bar{
  display:flex;gap:8px;margin-bottom:18px;
}
.search-bar input{
  flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 14px;
  font-size:14px;outline:none;color:var(--text);background:var(--bg);transition:.15s;
}
.search-bar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.search-bar input::placeholder{color:var(--text-3)}

/* ============ 软件卡片网格 ============ */
.software-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
}
.software-card{
  background:var(--bg);border:0.8px solid var(--border);border-radius:var(--radius);
  padding:16px;transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;gap:8px;
}
.software-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);border-color:var(--border-hover)}
.software-card .s-head{display:flex;align-items:flex-start;gap:10px}
.software-card .s-icon{
  width:40px;height:40px;border-radius:9px;
  background:var(--brand-light);display:grid;place-items:center;
  font-size:20px;flex-shrink:0;overflow:hidden;
  color:var(--brand);
}
.software-card .s-icon img{width:24px;height:24px;object-fit:contain;display:block}
.software-card .s-name{font-size:15px;font-weight:620;color:var(--text);letter-spacing:-.1px}
.software-card .s-ver{font-size:12px;color:var(--text-3);font-weight:400}
.software-card .s-desc{font-size:13px;color:var(--text-2);line-height:1.55;flex:1}
.software-card .s-tags{display:flex;flex-wrap:wrap;gap:4px}
.software-card .s-tags span{
  font-size:11px;padding:2px 7px;border-radius:5px;
  background:var(--bg-soft);color:var(--text-3);border:1px solid var(--border-light);
}
.software-card .s-actions{display:flex;gap:6px;margin-top:auto}
.s-btn{
  flex:1;text-align:center;padding:7px 10px;border-radius:7px;font-size:12.5px;
  font-weight:600;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px;
}
.s-btn.dl{
  background:var(--brand);color:#fff;
}
.s-btn.dl:hover{background:var(--brand-2);transform:translateY(-1px)}
.s-btn.official{
  background:var(--bg-soft);color:var(--text-2);border:1px solid var(--border);
}
.s-btn.official:hover{border-color:var(--brand);color:var(--brand)}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3);grid-column:1/-1}
.empty-state .big{font-size:42px;margin-bottom:10px}
.empty-state p{font-size:14px}

/* ============ 免责提示 ============ */
.disclaimer{

/* ============ 页脚 ============ */

footer .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
footer a:hover{color:var(--brand)}
footer .right{margin-left:auto;display:flex;gap:14px}
</style>
</head>

<script>
/* ===========================================================
   主题切换
   =========================================================== */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const saved = localStorage.getItem('vh_theme');
function paintTheme() {
  const dark = html.dataset.theme === 'dark';
  const moon = themeBtn.querySelector('.i-moon');
  const sun = themeBtn.querySelector('.i-sun');
  if (moon) moon.hidden = dark;
  if (sun) sun.hidden = !dark;
}
if (saved === 'dark') html.dataset.theme = 'dark';
paintTheme();

themeBtn.addEventListener('click', () => {
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('vh_theme', next);
  paintTheme();
});

/* ===========================================================
   分类定义
   =========================================================== */
const CATEGORIES = [
  { id:"all",        label:"全部软件", icon:"cat-all.svg" },
  { id:"compress",   label:"压缩工具", icon:"cat-compress.svg" },
  { id:"remote",     label:"远程控制", icon:"cat-remote.svg" },
  { id:"dev",        label:"开发工具", icon:"cat-dev.svg" },
  { id:"design",     label:"平面设计", icon:"cat-design.svg" },
  { id:"3d",         label:"三维设计", icon:"cat-3d.svg" },
  { id:"office",     label:"办公笔记", icon:"cat-office.svg" },
  { id:"system",     label:"系统工具", icon:"cat-system.svg" },
  { id:"media",      label:"多媒体",   icon:"cat-media.svg" },
  { id:"browser",    label:"浏览器",   icon:"cat-browser.svg" },
  { id:"ai",         label:"AI 相关",  icon:"cat-ai.svg" },
  { id:"productivity",label:"效率工具",icon:"cat-productivity.svg" },
  { id:"vm",         label:"虚拟机",   icon:"cat-vm.svg" },
  { id:"devops",     label:"开发环境", icon:"cat-devops.svg" },
];

/* ===========================================================
   状态
   =========================================================== */
let activeCat = "all";
let searchTerm = "";

/* ===========================================================
   iconHtml：把图标文件名渲染为 <img>（svg/png 统一）
   =========================================================== */
function iconHtml(f) {
  if (!f) return '';
  return `<img src="icons/${f}" alt="" loading="lazy">`;
}

/* ===========================================================
   渲染侧边栏
   =========================================================== */
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  // 保留搜索框
  const searchBox = document.getElementById('sideSearch').parentElement;
  sidebar.innerHTML = '';
  sidebar.appendChild(searchBox);

  // 分类标题
  const title = document.createElement('div');
  title.className = 'cat-title';
  title.textContent = '软件分类';
  sidebar.appendChild(title);

  CATEGORIES.forEach(cat => {
    const item = document.createElement('div');
    item.className = 'cat-item' + (cat.id === activeCat ? ' active' : '');
    item.innerHTML = `
      <span class="icon">${iconHtml(cat.icon)}</span>
      <span>${cat.label}</span>
      <span class="count">${countByCat(cat.id)}</span>
    `;
    item.addEventListener('click', () => {
      activeCat = cat.id;
      document.getElementById('catTitle').textContent = cat.label;
      renderSidebar();
      renderSoftware();
      // 移动端滚动内容区到顶部
      document.querySelector('.content').scrollIntoView({behavior:'smooth'});
    });
    sidebar.appendChild(item);
  });
}

function countByCat(catId) {
  if (catId === 'all') return SOFTWARE.length;
  return SOFTWARE.filter(s => s.cat === catId).length;
}

/* ===========================================================
   渲染软件卡片
   —— 'file' in s → 有本地安装包，只显示下载按钮（链接待填）
   —— 无 file 字段 → 仅显示官网链接
   =========================================================== */
function renderSoftware() {
  const grid = document.getElementById('softwareGrid');
  const term = searchTerm.toLowerCase().trim();

  let filtered = SOFTWARE;
  if (activeCat !== 'all') filtered = filtered.filter(s => s.cat === activeCat);
  if (term) {
    filtered = filtered.filter(s =>
      s.name.toLowerCase().includes(term) ||
      s.desc.toLowerCase().includes(term) ||
      s.tags.some(t => t.toLowerCase().includes(term)) ||
      s.cat.toLowerCase().includes(term)
    );
  }

  document.getElementById('totalCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="big"><svg class="ic" style="width:42px;height:42px"><use href="icons/ui.svg#i-search"/></svg></div>
        <p>没有找到匹配的软件</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(s => {
    if (s.file) {
      // 有本地安装包 → 下载按钮
      return `
        <div class="software-card">
          <div class="s-head">
            <div class="s-icon">${iconHtml(s.icon)}</div>
            <div>
              <div class="s-name">${s.name} <span class="s-ver">${s.ver}</span></div>
            </div>
          </div>
          <div class="s-desc">${s.desc}</div>
          <div class="s-tags">${s.tags.map(t => `<span>${t}</span>`).join('')}</div>
          <div class="s-actions">
            <a href="${s.file}" class="s-btn dl" download>
              <svg class="ic"><use href="icons/ui.svg#i-download"/></svg> 下载安装包
            </a>
          </div>
        </div>`;
    } else {
      // 无本地安装包 → 显示链接（官网或网盘等）
      const href = s.official || '#';
      return `
        <div class="software-card">
          <div class="s-head">
            <div class="s-icon">${iconHtml(s.icon)}</div>
            <div>
              <div class="s-name">${s.name} <span class="s-ver">${s.ver}</span></div>
            </div>
          </div>
          <div class="s-desc">${s.desc}</div>
          <div class="s-tags">${s.tags.map(t => `<span>${t}</span>`).join('')}</div>
          <div class="s-actions">
            <a href="${href}" class="s-btn ${s.official ? 'official' : 'dl'}" target="_blank" rel="noopener">
              ${s.official ? '<svg class="ic"><use href="icons/ui.svg#i-globe"/></svg> 前往下载页' : '<svg class="ic"><use href="icons/ui.svg#i-download"/></svg> 下载安装包'}
            </a>
          </div>
        </div>`;
      }
  }).join('');
}

/* ===========================================================
   搜索（防抖）
   =========================================================== */
let debounceTimer;
function onSearch(val) {
  searchTerm = val;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderSoftware, 200);
}

document.getElementById('mainSearch').addEventListener('input', e => onSearch(e.target.value));
document.getElementById('sideSearch').addEventListener('input', e => onSearch(e.target.value));

/* ===========================================================
   键盘快捷键 Ctrl+K 聚焦搜索
   =========================================================== */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('mainSearch').focus();
  }
});

/* ===========================================================
   初始化
   =========================================================== */
renderSidebar();
renderSoftware();
</script>
